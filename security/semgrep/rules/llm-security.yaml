rules:
  - id: llm-output-to-dangerous-sink
    languages: [python]
    severity: ERROR
    message: >
      Text generated by an LLM reaches eval/exec/a shell. Model output is attacker-influenced
      (prompt injection) and must be treated as untrusted input (OWASP LLM05: improper output handling).
    metadata:
      cwe: "CWE-94: Improper Control of Generation of Code"
      owasp-llm: "LLM05:2025 Improper Output Handling"
    mode: taint
    pattern-sources:
      - pattern: $CLIENT.messages.create(...)
      - pattern: $CLIENT.beta.messages.create(...)
    pattern-sinks:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: os.system(...)
      - pattern: subprocess.$FUNC(..., shell=True, ...)

  - id: llm-call-without-system-prompt
    languages: [python]
    severity: WARNING
    message: >
      LLM call without a system prompt. Role, scope and the "retrieved data is untrusted" rule
      belong in the system prompt, not in user-controlled content.
    metadata:
      owasp-llm: "LLM01:2025 Prompt Injection"
    patterns:
      - pattern-either:
          - pattern: $CLIENT.messages.create(...)
          - pattern: $CLIENT.beta.messages.create(...)
      - pattern-not: $CLIENT.messages.create(..., system=$S, ...)
      - pattern-not: $CLIENT.beta.messages.create(..., system=$S, ...)

  - id: fastapi-interactive-docs-enabled
    languages: [python]
    severity: WARNING
    message: >
      FastAPI app exposes /docs and /openapi.json. Disable them in production
      (docs_url=None, redoc_url=None, openapi_url=None).
    metadata:
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
    patterns:
      - pattern: fastapi.FastAPI(...)
      - pattern-not: fastapi.FastAPI(..., openapi_url=None, ...)

  - id: http-client-tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: TLS certificate verification is disabled for an HTTP client.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
    pattern-either:
      - pattern: httpx.$FUNC(..., verify=False, ...)
      - pattern: requests.$FUNC(..., verify=False, ...)
