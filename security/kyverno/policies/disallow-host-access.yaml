apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-host-access
  annotations:
    policies.kyverno.io/title: Disallow host namespaces and hostPath volumes
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: host-namespaces
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # Platform namespaces run vendor charts (Kyverno, Argo CD, Prometheus) with their own
      # hardening; they are excluded explicitly instead of weakening the rules for workloads.
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, local-path-storage, kyverno, argocd, monitoring]
      validate:
        message: "hostNetwork, hostPID and hostIPC are not allowed."
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
    - name: host-path
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # Platform namespaces run vendor charts (Kyverno, Argo CD, Prometheus) with their own
      # hardening; they are excluded explicitly instead of weakening the rules for workloads.
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, local-path-storage, kyverno, argocd, monitoring]
      validate:
        message: "hostPath volumes are not allowed."
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"
