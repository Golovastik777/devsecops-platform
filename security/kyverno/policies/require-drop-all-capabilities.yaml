apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-drop-all-capabilities
  annotations:
    policies.kyverno.io/title: Drop all Linux capabilities
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: drop-all
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # Platform namespaces run vendor charts (Kyverno, Argo CD, Prometheus) with their own
      # hardening; they are excluded explicitly instead of weakening the rules for workloads.
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, local-path-storage, kyverno, argocd, monitoring]
      validate:
        message: "Containers must drop ALL capabilities."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                all:
                  - key: ALL
                    operator: AnyNotIn
                    value: "{{ element.securityContext.capabilities.drop[] || `[]` }}"
