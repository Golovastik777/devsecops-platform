apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root
  annotations:
    policies.kyverno.io/title: Require non-root user and read-only root filesystem
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # Platform namespaces run vendor charts (Kyverno, Argo CD, Prometheus) with their own
      # hardening; they are excluded explicitly instead of weakening the rules for workloads.
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, local-path-storage, kyverno, argocd, monitoring]
      validate:
        message: "Pods must set securityContext.runAsNonRoot=true."
        pattern:
          spec:
            securityContext:
              runAsNonRoot: "true"
    - name: read-only-root-filesystem
      match:
        any:
          - resources:
              kinds: ["Pod"]
      # Platform namespaces run vendor charts (Kyverno, Argo CD, Prometheus) with their own
      # hardening; they are excluded explicitly instead of weakening the rules for workloads.
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kube-public, local-path-storage, kyverno, argocd, monitoring]
      validate:
        message: "Containers must use readOnlyRootFilesystem=true."
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: "true"
