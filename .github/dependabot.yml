version: 2
updates:
  - package-ecosystem: pip
    directories: ["/app", "/ci", "/infra/ansible", "/infra/pulumi"]
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: docker
    directory: /app
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directories: ["/infra/terraform/aws", "/infra/terraform/hetzner", "/infra/terraform/digitalocean"]
    schedule: {interval: monthly}
