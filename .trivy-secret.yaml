# Trivy secret scanning: allow-rules for known false positives only.
allow-rules:
  - id: third-party-python-packages
    description: >
      Vendored SDK sources contain documentation examples of credential formats
      (e.g. GCP service-account JSON in anthropic/resources/beta/agents). Our own code is
      scanned by gitleaks over the full git history.
    path: .*/site-packages/.*
