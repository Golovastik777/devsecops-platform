apiVersion: v1
kind: Service
metadata:
  name: kb-assistant
  namespace: kb-assistant
  labels:
    app.kubernetes.io/name: kb-assistant  # selected by the ServiceMonitor
spec:
  selector:
    app.kubernetes.io/name: kb-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
