# Least-privilege identity for the CD job: it can only change the image/spec of the one
# kb-assistant Deployment and watch the rollout. Services, NetworkPolicies and RBAC are
# owned by the platform team and applied separately; no Secrets, no pods/exec, nothing cluster-wide.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: kb-assistant
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: kb-assistant
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["kb-assistant"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: kb-assistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: kb-assistant
