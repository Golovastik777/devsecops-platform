# Fast local checks before a commit; CI runs the full set.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.183.0
    hooks:
      - id: semgrep
        args: ["--config", "security/semgrep/rules/", "--error", "--metrics=off"]
